name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: "file:./prisma/dev.db"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      DEV_AUTH_SECRET: "ci-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail the build on a HIGH or CRITICAL production dependency advisory.
      - run: npm audit --omit=dev --audit-level=high
